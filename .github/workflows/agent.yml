name: Dark Psychology Money Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"  # Daily at 16:00 UTC (~8am Los Angeles, varies with DST)

permissions:
  contents: write

concurrency:
  group: "daily-agent"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Agent
        run: python generate_post.py

      - name: Commit & Push Output
        run: |
          git config user.name "content-agent"
          git config user.email "agent@users.noreply.github.com"
          git add output/post.txt output/posts_*.txt
          git commit -m "agent: generate post" || echo "No changes to commit"
          git push
