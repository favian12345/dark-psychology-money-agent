name: Dark Psychology Money Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"  # Daily at 16:00 UTC (~8am Los Angeles, varies with DST)

permissions:
  contents: write

concurrency:
  group: "daily-agent"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: pip install pillow imageio-ffmpeg

      - name: Run Agent (text + images + mp4)
        run: python generate_assets.py

      - name: Commit & Push Output
        run: |
          git config user.name "content-agent"
          git config user.email "agent@users.noreply.github.com"
            git add output/post*.txt output/posts_*.txt output/*.png output/short_*.mp4
            git commit -m "agent: scale to 3 shorts per run" || echo "No changes to commit"
         git push
